name: 데이터 갱신 및 배포

on:
  schedule:
    - cron: "40 7 * * 1-5"   # 평일 16:40 KST (장 마감 15:30 + 컨센서스 반영 여유)
  workflow_dispatch:          # Actions 탭에서 수동 실행
  push:
    branches: [main]
    paths: ["site/**", "config/**", "collector/**", ".github/workflows/**"]

permissions:
  contents: write   # 수집 데이터 커밋(컨센서스 변화 추적용 스냅샷 보관)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 테스트
        run: python -m pytest -q

      # 코드·설정만 바뀐 push 에서는 수집하지 않고 기존 데이터로 다시 배포만 한다.
      # (scoring.yaml 가중치를 바꾼 뒤 바로 반영하려면 Actions 에서 수동 실행)
      - name: 데이터 수집 (시트 → 시세·실적·공시 → 점수)
        if: github.event_name != 'push'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -m collector.main

      - name: 데이터 커밋
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +%F) 갱신"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
