name: 데이터 갱신 및 배포

on:
  schedule:
    - cron: "40 7 * * 1-5"   # 평일 16:40 KST (장 마감 15:30 + 컨센서스 반영 여유)
  workflow_dispatch:          # Actions 탭에서 수동 실행
  push:
    branches: [main]
    paths: ["site/*.html", "site/*.js", "site/*.css", "config/**", "collector/**", ".github/workflows/update.yml"]

permissions:
  contents: write   # 컨센서스 변화 추적용 스냅샷(site/data/history)만 커밋
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 테스트
        run: python -m pytest -q

      # 코스피·코스닥 전 종목 분석 (약 10~20분). 결과(latest.json, stock/*.json)는 커밋하지 않고 바로 배포한다.
      - name: 데이터 수집 (시트 → 전 종목 → 점수·투자논리)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -m collector.main

      - name: 스냅샷 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/history
          git diff --cached --quiet || git commit -m "history: $(TZ=Asia/Seoul date +%F) 컨센서스 스냅샷"
          git pull --rebase -q origin main && git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
