# ============================================================
#  매수 순위 점수·등급·매매 전략 설정
#  - 숫자만 바꾸고 저장 → 다음 갱신(또는 Actions 수동 실행) 때 반영됩니다.
#  - 각 항목 점수는 0~100점, 총점 = 가중평균 − 리스크 감점
#  - 데이터가 없는 항목은 빼고 나머지 가중치로 다시 나눕니다(N/A 는 0점 처리하지 않음).
# ============================================================

# ---- 1. 항목별 가중치 (합이 100일 필요는 없음, 비율로 계산) ----
weights:
  upside: 35          # 업사이드(목표가 대비)
  valuation: 25       # 밸류에이션(섹터 대비 PER·PBR, Forward PER)
  momentum: 20        # 실적 모멘텀(EPS 성장률, 컨센서스 상향/하향)
  price_position: 20  # 가격 위치(52주 범위, 1M/3M 수익률)

# ---- 등급 기준 (총점) ----
grades:
  green: 65    # 🟢 개꿀(적극 매수): 이 점수 이상
  yellow: 52   # 🟡 분할매수
  white: 40    # ⚪ 관망   (미만이면 🔴 비싸다)
  min_coverage: 0.6         # 가중치 기준 데이터 충족률이 이보다 낮으면 최고 ⚪
  red_if_negative_upside: true   # 현재가가 목표가 이상이면 점수와 무관하게 🔴

# ---- 1. 업사이드 ----
upside:
  target_source: club_first   # club_first(모임 목표가 우선) | consensus_first | average
  worst_pct: -10              # 업사이드 -10% 이하 → 0점
  best_pct: 50                # 업사이드 +50% 이상 → 100점

# ---- 2. 밸류에이션 ----
valuation:
  sub_weights: {per_vs_sector: 0.4, pbr_vs_sector: 0.3, forward_per: 0.3}
  # 종목 배수 ÷ 섹터 배수 비율 → 점수 (0.5배면 100점, 1.5배면 0점)
  ratio_best: 0.5
  ratio_worst: 1.5
  # Forward PER ÷ Trailing PER (0.6이면 100점 = 이익 급증 예상, 1.2면 0점)
  fwd_ratio_best: 0.6
  fwd_ratio_worst: 1.2
  loss_making_score: 10       # 적자(PER 음수/산출불가)일 때 해당 세부 점수
  sector_benchmark: naver_industry_first   # naver_industry_first | club_sector
  sector_min_members: 2       # 모임 섹터 평균을 쓰려면 최소 종목 수(미달 시 전체 중앙값)

# ---- 3. 실적 모멘텀 ----
momentum:
  sub_weights: {eps_growth: 0.6, revision: 0.4}
  eps_growth_worst_pct: -20   # 내년 예상 EPS 성장률
  eps_growth_best_pct: 40
  turnaround_score: 85        # 적자→흑자전환 예상
  revision_lookback_days: 30  # 컨센서스 변화 비교 기간(자체 저장한 과거 스냅샷 기준)
  revision_worst_pct: -10
  revision_best_pct: 10

# ---- 4. 가격 위치 ----
price_position:
  sub_weights: {range_position: 0.5, return_3m: 0.3, return_1m: 0.2}
  # 52주 범위 내 위치(저가=0, 고가=1). 낮을수록 점수↑ (pos 0 → 100점, 1 → 0점)
  return_3m_best_pct: -20     # 3개월 -20% 조정이면 100점
  return_3m_worst_pct: 50     # 3개월 +50% 급등이면 0점
  return_1m_best_pct: -10
  return_1m_worst_pct: 25

# ---- 5. 리스크 감점 (점수에서 빼는 점, 최대 합계 max_total) ----
risk:
  max_total: 25
  dilution_full_pct: 10       # 잠재 희석률(CB·BW·유증) 10% 이상 → dilution_points 전부 감점
  dilution_points: 12
  cb_lookback_years: 3
  rights_lookback_years: 1
  debt_ratio_start_pct: 100   # 부채비율 100%부터 감점 시작
  debt_ratio_full_pct: 300    # 300% 이상 → debt_points 전부 감점
  debt_points: 8
  memo_points_per_keyword: 1.5   # 시트 Risk/비고 메모에 키워드 1개당
  memo_points_max: 5
  memo_keywords: [유상증자, 유증, CB, BW, 전환사채, 신주인수권, 오버행, 메자닌, 희석, 소송,
                  적자, 감사의견, 관리종목, 최대주주 변경, 횡령, 배임, 블록딜, 보호예수, 상장폐지]

# ============================================================
#  매매 전략 (종목별 자동 산출)
# ============================================================
strategy:
  entry_steps_pct: [0, -5, -10]     # 1·2·3차 매수가(현재가 대비)
  entry_split: [0.4, 0.3, 0.3]      # 각 차수 매수 비율
  support_lookbacks: [60, 120]      # 지지선 = 최근 N일 저가
  support_snap_pct: 3               # 계단 가격 ±3% 안에 지지선이 있으면 지지선 가격으로 대체
  stop_loss_pct: -8                 # 평균 진입가 대비 손절
  stop_below_support_pct: -2        # 주요 지지선 -2% 이탈 시 손절
  take_profit_1_progress: 0.5       # 목표가까지 상승여력의 50% 도달 → 1차 익절
  take_profit_1_fraction: 0.333     # 1차 익절 시 보유분의 1/3 매도
  trailing_stop_pct: -10            # 1차 익절 이후 고점 대비 -10% 추적 손절
  max_weight_pct: 15                # 한 종목 최대 비중
  grade_multiplier: {green: 1.0, yellow: 0.5, white: 0, red: 0}

# ---- 현금 관리 ----
cash:
  index_symbol: KOSPI
  ma_short: 60
  ma_long: 120
  base_pct:                 # 코스피 추세별 기본 현금 비중
    above_both: 20          # 60·120일선 모두 위 (상승 추세)
    mixed: 35               # 하나만 위
    below_both: 50          # 모두 아래 (하락 추세)
  green_adjust:             # 🟢 종목 수에 따른 가감(위에서부터 첫 조건 적용)
    - {min_green: 5, adj: -10}
    - {min_green: 2, adj: -5}
    - {min_green: 1, adj: 0}
    - {min_green: 0, adj: 15}
  min_pct: 10
  max_pct: 70
