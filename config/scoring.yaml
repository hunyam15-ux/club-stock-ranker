# ============================================================
#  매수 점수·등급·매매 전략 설정 (보수적 버전)
#  - 숫자만 바꾸고 저장 → 다음 갱신(또는 Actions 수동 실행) 때 반영
#  - 각 항목 0~100점, 총점 = 가중평균 − 리스크 감점
#  - 데이터가 없는 항목은 '제외'하지 않고 missing_component_score(보수적 점수)로 계산
# ============================================================

# ---- 종목 선정 프로세스 ① 퀄리티 체크 (걸린 항목당 감점 = 가치 함정 회피) ----
quality:
  penalty_per_fail: 5        # 항목당 −5점
  penalty_max: 15
  min_roe: 5                 # 최근 연간 ROE 5% 미만
  max_debt_ratio: 200        # 부채비율 200% 초과 (금융업 제외)
  max_dilution_pct: 10       # CB·BW·유증 잠재 희석 10% 이상

# ---- ② 떨어지는 칼날: 3개월 -30% 이하 + 200일선 아래 + 컨센서스 상향 없음 → 감점 ----
falling_knife:
  ret_3m_pct: -30
  penalty_points: 3

# ---- ③ 알파 점수 가중치 ----
weights:
  upside: 25         # 보수적 목표가 대비 업사이드
  value: 25          # 업종 대비 PER·PBR, Forward PER, 안전마진(내재가치 할인율)
  growth: 15         # EPS·영업이익 성장
  alpha: 20          # 실적 서프라이즈 · 신규 수주 · 컨센서스 상향
  price_risk: 15     # 52주 위치 · 3개월 수익률 · 저변동성
missing_component_score: 30   # 데이터 없는 항목 점수(보수적)

# ---- 등급 기준 (총점) ----
grades:
  green: 66                  # (√ 곡선 도입으로 점수대가 전반적으로 내려가 70→66)
  yellow: 55
  white: 45
  min_coverage: 0.7          # 충족률 70% 미만이면 🔴 대신 ⚪(데이터 부족) 표시
  red_if_negative_upside: true
  max_green: 20              # 🟢 정원
  max_yellow: 60             # 🟡 정원

# ---- 목표가 (보수적) ----
target:
  mode: conservative         # conservative = min(컨센서스×할인, 내재가치) | consensus_first
  consensus_haircut: 0.9     # 증권사 목표가는 낙관 편향 → 10% 할인해서 사용
  intrinsic_eps_haircut: 0.2 # 내재가치 = 예상 EPS × (1−20%) × 업종 중앙 PER (모임 자료의 'EPS 감익 × PER' 방식)
  intrinsic_per_cap: 25      # 업종 PER 상한
  model_max_upside_pct: 50   # 컨센서스 없이 내재가치만 있을 때 업사이드 상한
  intrinsic_outlier_pct: 300 # 내재가치가 현재가 +300% 초과면 이상치로 보고 사용하지 않음
  holdco_haircut: 0.2        # 지주사: 지주사끼리 PER 비교 + 목표가·내재가치 20% 추가 할인(지주 할인은 잘 안 풀린다)
  source_order: [consensus, model, club]   # (consensus_first 모드에서만 사용)
  model_haircut: 0.85
  model_per_cap: 30
  model_upside_weight: 0.7    # 컨센서스 없이 내재가치만으로 낸 업사이드는 점수 계산 시 70%만 인정
  sensitivity_eps_cuts: [0, -10, -20, -30, -40]     # 상세 화면 민감도 표
  sensitivity_per_mults: [0.6, 0.8, 1.0, 1.2]       # × 업종 중앙 PER

# ---- 1. 업사이드 ----
upside:
  worst_pct: 0               # 보수적 목표가 대비 0% 이하 → 0점
  best_pct: 120              # +120% 이상 → 100점, √ 곡선(+40% ≈ 58점, +60% ≈ 71점, +100% ≈ 91점)
                             # (+60%=100점 직선이었을 때 상위 종목이 모두 100점이라 변별력이 없었음)

# ---- 2. 가치 ----
valuation:
  sub_weights: {per_vs_sector: 0.3, pbr_vs_sector: 0.2, forward_per: 0.2, margin_of_safety: 0.3}
  ratio_best: 0.5            # 종목 배수 ÷ 업종 배수 = 0.5 → 100점
  ratio_worst: 1.3           # 1.3 → 0점
  fwd_ratio_best: 0.6
  fwd_ratio_worst: 1.1
  mos_best_pct: 120          # 안전마진(내재가치/현재가−1) +120% → 100점 (√ 곡선)
  mos_worst_pct: -10         # −10% → 0점
  loss_making_score: 0
  sector_min_members: 3

# ---- 3. 성장 ----
growth:
  sub_weights: {eps_growth: 0.5, op_growth: 0.5}
  worst_pct: -10
  best_pct: 100              # √ 곡선: +25% ≈ 56점, +50% ≈ 74점, +100% = 100점
  turnaround_score: 70

# ---- 4. 알파 (모임 자료: 실적 vs 컨센서스, 장비 수주잔고, 컨센서스 추이) ----
alpha:
  sub_weights: {surprise: 0.4, orders: 0.3, revision: 0.3}
  surprise_worst_pct: -10    # 최근 분기 영업이익 / 발표 직전 컨센서스 − 1
  surprise_best_pct: 15
  q_yoy_worst_pct: -20       # 서프라이즈 기록이 쌓이기 전 대리 지표: 최근 분기 영업이익 YoY
  q_yoy_best_pct: 150        # √ 곡선
  orders_worst_pct: 0        # 최근 6개월 단일판매·공급계약 공시 합계(최근 매출 대비 %)
  orders_best_pct: 30
  orders_months: 6
  revision_lookback_days: 30
  revision_worst_pct: -10
  revision_best_pct: 10

# ---- 5. 가격·위험 (저변동성 투자) ----
price_risk:
  sub_weights: {range_position: 0.35, return_3m: 0.25, low_volatility: 0.4}
  return_3m_best_pct: -15
  return_3m_worst_pct: 40
  vol_best_pct: 25           # 연 변동성 25% 이하 → 100점
  vol_worst_pct: 80          # 80% 이상 → 0점

# ---- 리스크 감점 (점수에서 빼는 점, 최대 max_total) ----
risk:
  max_total: 30
  dart_top_n: 100            # DART(희석·부채·대주주·수주)는 1차 점수 상위 N + 모임 종목만
  dilution_full_pct: 10
  dilution_points: 15
  cb_lookback_years: 3
  rights_lookback_years: 1
  debt_ratio_start_pct: 100
  debt_ratio_full_pct: 300
  debt_points: 10
  memo_points_per_keyword: 2
  memo_points_max: 6
  memo_keywords: [유상증자, 유증, CB, BW, 전환사채, 신주인수권, 오버행, 메자닌, 희석, 소송,
                  적자, 감사의견, 관리종목, 최대주주 변경, 횡령, 배임, 블록딜, 보호예수, 상장폐지]

# ============================================================
#  매매 전략 — 전략적 가치투자(가치 가중 · 코어&새틀라이트 · 정률투자 · 절대모멘텀)
# ============================================================
strategy:
  entry_steps_pct: [0, -5, -10]
  entry_split: [0.3, 0.3, 0.4]      # 보수적: 아래로 갈수록 많이
  support_lookbacks: [60, 120]
  support_snap_pct: 3
  stop_loss_pct: -8
  stop_below_support_pct: -2
  take_profit_1_progress: 0.5
  take_profit_1_fraction: 0.333
  trailing_stop_pct: -10
  max_weight_pct: 20                # 한 종목 최대 비중(코어)
  grade_multiplier: {green: 1.0, yellow: 0.5, white: 0, red: 0}
  core_satellite:
    core_ratio: 0.8                 # 주식 몫의 80%는 코어(대형주), 20%는 새틀라이트(중소형)
    core_min_mcap_eok: 20000        # 코어 = 시총 2조↑ · 퀄리티 통과
    core_size: 4                    # 코어 최대 4종목
    satellite_size: 2               # 새틀라이트 최대 2종목
    satellite_max_weight_pct: 8     # 새틀라이트 한 종목 최대 8%
    boost_score: 80                 # 새틀라이트가 '진짜 개꿀'(🟢·총점 80↑)이면
    boost_ratio: 0.3                #   새틀라이트 몫을 30%까지,
    boost_max_weight_pct: 15        #   한 종목 15%까지 허용
    # 비중 상한 때문에 못 쓴 주식 몫은 지수 ETF(코스피200)로 채움
  diversification:
    one_per_group: true             # 같은 그룹은 1종목만 (예: HD현대·HD건설기계, SK스퀘어·SK하이닉스)
    max_per_sector: 2               # 한 섹터 최대 2종목
    max_sector_pct: 40              # 한 섹터 합계는 주식 몫의 40%까지 (넘치면 지수 ETF)
  value_weighting: true             # 비중 ∝ 총점 × (1+안전마진) ÷ 변동성 (가치 가중)

# ---- 현금 관리: 정률투자 + 추세 + 절대모멘텀 + 매크로 불안요소 ----
cash:
  index_symbol: KOSPI
  base_pct: 30                      # 정률 기본: 주식 70 : 현금 30
  ma_short: 60
  ma_long: 120
  trend_adj: {above_both: -10, mixed: 0, below_both: 10}
  abs_momentum_adj: 10              # 코스피 12개월 수익률 < 0 이면 +10%p (절대모멘텀)
  green_adjust:
    - {min_green: 10, adj: -5}
    - {min_green: 3, adj: 0}
    - {min_green: 0, adj: 10}
  macro:
    hy_spread_high: 4.5             # 하이일드 스프레드 4.5% 이상
    hy_spread_high_adj: 10
    hy_spread_jump: 0.5             # 1개월 +0.5%p 이상 확대
    hy_spread_jump_adj: 5
    us10y_high: 4.75                # 미국 10년물 4.75% 이상
    us10y_high_adj: 5
  min_pct: 15
  max_pct: 70
  rebalance_band_pct: 5             # 실제 현금 비중이 권장치에서 ±5%p 벗어나면 리밸런싱
  # 현금 몫을 어디에 둘지 (주식 외 자산)
  parking:
    base_split: {short_bond: 0.6, gov_bond: 0.15, cash: 0.25}   # 나머지: 단기채·금리형 ETF / 국채 ETF / 현금성
    duration_kr10y: 3.5             # 한국 10년물이 이 이상이면 국채 비중을 늘림(금리 하락 시 차익)
    duration_split: {short_bond: 0.5, gov_bond: 0.3, cash: 0.2}
